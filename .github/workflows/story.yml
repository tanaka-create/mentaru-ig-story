name: めんたるIG ストーリー自動投稿

# 毎朝 6:00 JST に、未投稿のセットを1つ（問いかけ→答えの2枚）投稿する。cron は UTC。
# GitHubの起動は遅れることがあるので 5:40 に起動して 6:00 まで待つ。遅れた日用に予備の起動もある
# （その日すでに出していれば何もしない／途中で止まっていれば続きから出す）。
on:
  schedule:
    - cron: '40 20 * * *'   # 05:40 JST
    - cron: '17 23 * * *'   # 08:17 JST 予備
    - cron: '43 1 * * *'    # 10:43 JST 予備
    - cron: '23 4 * * *'    # 13:23 JST 予備
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run=確認だけ / check=鍵と権限の確認 / post=今日の分を今すぐ投稿 / extra=今日もう1セット追加で投稿 / notify_test=LINE通知テスト'
        type: choice
        options: [dry_run, check, post, extra, notify_test]
        default: dry_run

permissions:
  contents: write

concurrency:
  group: mentaru-story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ストーリーを投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          IG_TOKEN_ISSUED: ${{ vars.IG_TOKEN_ISSUED }}
          POST_HOUR: ${{ vars.POST_HOUR }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          NOTIFY_TEST: ${{ github.event.inputs.mode == 'notify_test' && '1' || '' }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry_run) python3 post_story.py --dry-run --force ;;
            check|notify_test) python3 post_story.py --check ;;
            post)    python3 post_story.py ;;
            extra)   python3 post_story.py --force ;;
            *)       python3 post_story.py ;;
          esac
      - name: 投稿記録をコミットする
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "ストーリー投稿 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git push -q origin main && exit 0; git pull -q --rebase origin main; done
